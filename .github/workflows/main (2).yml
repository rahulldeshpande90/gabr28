
name: Node.js CI with Cache

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    name: BUILD-JOB
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v6

      # Setup Node.js and enable npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Build application
      - name: Build
        run: npm run build --if-present

      # Run tests
      - name: Test
        run: npm test
